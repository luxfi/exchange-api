name: Docker

# Builds ghcr.io/luxfi/exchange-api on the forge's runner pool.
#
# The forge (git.hanzo.ai) is where this repo builds: its runners carry the
# lux-build label and the luxfi org there holds GHCR_USER/GHCR_TOKEN. GitHub is
# a mirror with no runners registered for it, so a run scheduled there queues
# until it times out.
#
# This repo had no workflow at all. Its images were pushed by hand, which is why
# what runs in the cluster does not correspond to any tag in this history, and
# why a tag could be cut and reach nothing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'existing version tag to (re)build, e.g. v2.3.16'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: lux-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxfi/exchange-api
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,format=short,prefix=sha-

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=ghcr.io/luxfi/exchange-api:buildcache
          cache-to: type=registry,ref=ghcr.io/luxfi/exchange-api:buildcache,mode=max
