name: Docker
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

# Native exchange-api (TypeScript: src/index.ts -> dist/index.js, /v1/graphql with
# operation-aware amm/dex routing). Publishes the canonical ghcr.io/luxfi/exchange-api
# image on v* tags. amd64-only on luxfi's in-cluster ARC pool (lux-build) — the cluster
# runs amd64 and QEMU arm64 emulation pushes the build from ~5 min to ~2 h; an arm64
# image can return via a native arm64 runner matrix entry, not via QEMU.
# Semver-only — only v* tags produce {{version}} manifests.

jobs:
  docker:
    # In-cluster ARC pool (lux-build autoscalingrunnerset in lux-k8s, org-scoped to
    # github.com/luxfi, amd64). Replaces the classic [self-hosted, linux, amd64] triple
    # serviced by fleet arcd hosts that are not reliably available.
    runs-on: lux-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host
      # The ghcr.io/luxfi/exchange-api package is org-internal and not yet
      # linked to this repo, so the repo-scoped GITHUB_TOKEN is denied
      # write_package on push. Log in with a cross-org PAT (org GH_TOKEN, else
      # repo UNIVERSE_PAT — both carry write:packages); the source label below
      # makes GHCR auto-link the package to this repo on first push.
      - id: pat
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          UNIVERSE_PAT: ${{ secrets.UNIVERSE_PAT }}
          # orgs/luxfi provisions GHCR_TOKEN + GHCR_USER and nothing else -- no
          # GH_PAT, no UNIVERSE_PAT. GHCR_TOKEN must be a real GitHub PAT for
          # ghcr.io to accept it, so it can resolve private modules too.
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          tok="$GH_TOKEN"; src="GH_TOKEN"
          if [ -z "$tok" ]; then tok="$UNIVERSE_PAT"; src="UNIVERSE_PAT"; fi
          if [ -z "$tok" ]; then tok="$GHCR_TOKEN"; src="GHCR_TOKEN"; fi
          if [ -z "$tok" ]; then
            echo "::error::No GH_TOKEN or UNIVERSE_PAT secret set — cannot push to the unlinked ghcr package"
            exit 1
          fi
          echo "Using secret: $src (length=${#tok})"
          echo "::add-mask::$tok"
          { echo "token<<EOF"; echo "$tok"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ steps.pat.outputs.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxfi/exchange-api
          flavor: latest=false
          labels: |
            org.opencontainers.image.source=https://github.com/luxfi/exchange-api
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/luxfi/exchange-api:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/luxfi/exchange-api:buildcache-amd64,mode=max
          provenance: false
          push: true
